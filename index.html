<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Spots Social Media">
  <meta name="author" content="Diamond Christian">
  <meta name="keywords" content="Html">
  <link rel="stylesheet" href="./pages/index.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Spots</title>
</head>
<body>
<div class="page">
  <header class="header">
      <img class="header__logo" src="./images/spots-logo.png" alt="Spots Logo">
  </header>
  <main class="content">
    <section class="profile page__section">
      <img src="./images/avatar.jpg" alt="Bessie Coleman" class="profile__avatar">
      <div class="profile__column">
        <h1 class="profile__name">Bessie Coleman</h1>
        <p class="profile__description">Civil Aviator</p>
        <button type="button" class="profile__edit-btn">
          <img src="./images/pencil-icon.svg" alt="Pencil Icon" class="profile__">Edit Profile
        </button>
      </div>
      <button type="button" class="profile__add-btn">
          <img src="./images/plus-icon.svg" alt="Plus Icon" class="profile__">New Post
      </button>
    </section>
    <section class="cards">
      <ul class="cards__list">
        <li class="card">
          <img
            src="./images/1-photo-by-moritz-feldmann-from-pexels.jpg"
            alt="Val Thorens"
            class="card__image">
            <div class="card__content">
              <h2 class="card__title">Val Thorens</h2>
              <button type="button" class="card__like-btn"></button>
            </div>
        </li>
        <li class="card">
          <img
            src="./images/2-photo-by-ceiline-from-pexels.jpg"
            alt="Val Thorens"
            class="card__image">
            <div class="card__content">
              <h2 class="card__title">Val Thorens</h2>
              <button type="button" class="card__like-btn"></button>
            </div>
        </li>
        <li class="card">
          <img
            src="./images/3-photo-by-tubanur-dogan-from-pexels.jpg"
            alt="Val Thorens"
            class="card__image">
            <div class="card__content">
              <h2 class="card__title">Val Thorens</h2>
              <button type="button" class="card__like-btn"></button>
            </div>
        </li>
        <li class="card">
          <img
            src="./images/4-photo-by-maurice-laschet-from-pexels.jpg"
            alt="Val Thorens"
            class="card__image">
            <div class="card__content">
              <h2 class="card__title">Val Thorens</h2>
              <button type="button" class="card__like-btn"></button>
            </div>
        </li>
        <li class="card">
          <img
            src="./images/5-photo-by-van-anh-nguyen-from-pexels.jpg"
            alt="Val Thorens"
            class="card__image">
            <div class="card__content">
              <h2 class="card__title">Val Thorens</h2>
              <button type="button" class="card__like-btn"></button>
            </div>
        </li>
        <li class="card">
          <img
            src="./images/6-photo-by-moritz-feldmann-from-pexels.jpg"
            alt="Val Thorens"
            class="card__image">
            <div class="card__content">
              <h2 class="card__title">Val Thorens</h2>
              <button type="button" class="card__like-btn"></button>
            </div>
        </li>
      </ul>
    </section>
  </main>
  <footer class="footer">

  </footer>
</div>
</body>
</html>
